<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<link
			rel="icon"
			type="image/png"
			href="https://courses.joshwcomeau.com/favicon.rainbow.png"
		>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Code Playground</title>
	</head>
	<body>
		<style>
		@keyframes grow {
			to {
				r: 50px;
			}
		}
		@keyframes fadeToTransparent {
			to {
				opacity: 0;
			}
		}

		/* Fallback for motion-sensitive folks */
		.pop-btn.popped {
			.pop-circle {
				animation:
					grow 0ms forwards var(--easing-smooth),
					fadeToTransparent 500ms 200ms forwards;
			}
		}

		/* Animated version: */
		@media (prefers-reduced-motion: no-preference) {
			.pop-btn.popped {
				--grow-duration: 600ms;
				--mask-delay: 200ms;
				--time-until-popped: calc(var(--grow-duration) + var(--mask-delay));

				.pop-circle {
					animation:
						grow var(--grow-duration) var(--easing-smooth) forwards,
						fadeToTransparent 300ms var(--time-until-popped) forwards;
				}
				.mask-circle {
					animation: grow var(--grow-duration) var(--mask-delay)
						var(--easing-smooth) forwards;
				}
			}
		}
		</style>

		<button type="button" class="pop-btn">
			<svg viewBox="0 0 100 100" fill="none">
				<title>Pop!</title>
				<defs>
					<mask id="pop-mask">
						<rect x="0" y="0" width="100" height="100" fill="white" />
						<circle class="mask-circle" cx="50" cy="50" r="0" fill="black" />
					</mask>
				</defs>

				<circle
					class="pop-circle"
					mask="url(#pop-mask)"
					cx="50"
					cy="50"
					r="0"
					fill="hsl(270deg 100% 80%)"
				/>
			</svg>
			<span class="visually-hidden"> Pop! </span>
		</button>

		<script type="module" src="/src/index.js"></script>
	</body>
</html>
