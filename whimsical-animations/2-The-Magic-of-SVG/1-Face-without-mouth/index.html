<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="https://courses.joshwcomeau.com/favicon.rainbow.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Code Playground</title>
  </head>
  <body>
    <svg width="240" height="240">
      <title>circle emoji no mauth</title>

      <circle
        r="120"
        cx="120"
        cy="120"
        fill="hsl(45deg 100% 50%)"
      >
      </circle>

      <ellipse
        fill="#663b00"
        cx="80"
        cy="95"
        rx="11"
        ry="15"
      />

      <ellipse
        fill="#663b00"
        cx="160"
        cy="95"
        rx="11"
        ry="15"
      />


      <line
        x1="60" y1="150" x2="180" y2="150"
        stroke-width="8"
        stroke="#663b00"
        stroke-linecap="round"
      />


    </svg>

    <!--
      SVG Cheatsheet

      Circles:
        <circle cx="12" cy="23" r="34" />

      Ovals:
        <ellipse cx="12" cy="23" rx="34" ry="45"  />

      Lines:
        <line x1="12" y1="23" x2="34" y2="45"  />

      Presentational attributes:
        fill="[color]"
        stroke="[color]"
        stroke-width="[number]"
        stroke-linecap="[string]"
        stroke-dasharray="[dash] [gap]"
        stroke-dashoffset="[number]"
    -->



    <div class="reference">
      <img
        alt="the macOS “mouthless” emoji"
        src="https://sandpack-bundler.vercel.app/img/emoji-macos-no-mouth.png"
      />
    </div>

    <script type="module" src="/src/index.js"></script>
  </body>
</html>
