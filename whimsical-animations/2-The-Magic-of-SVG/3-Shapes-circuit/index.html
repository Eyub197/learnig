<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="https://courses.joshwcomeau.com/favicon.rainbow.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Code Playground</title>
  </head>
  <body>
    <svg
      width="240"
      height="240"
      viewBox="0 0 24 24"
    >
      <title>shape</title>
      <!-- Parallelogram -->
      <path
        d="
          M 2 4
          L 4 8
          L 10 8
          L 8 4
          Z
          "
      />

      <!-- Triangle -->
      <path
        d="
          M 6 15
          L 9 21
          L 3 21
          Z
        "
      />

      <!-- Pac-man -->
      <path
        d="
          M 21 4
          A 3 3 0 1 0 21 8
          L 19 6
          Z
          "
      />

      <!-- Squiggle -->
      <path
        d="
          M 14 18
          C 18,24 18,12 22,18
        "
      />
    </svg>



    <!--
      Paths Cheatsheet

      Move:
        M x,y

      Line:
        L x,y

      Bezier curves:
        Q p1x,p1y x,y
        C p1x,p1y p2x,p2y x,y

      Arc:
        A rx,ry rotation large-arc-flag sweep-flag x,y

      Close path:
        Z

      *Remember, paths are case-sensitive!* If you’re
      seeing weird results, make sure you’re using
      uppercase commands.
    -->

    <script type="module" src="/src/index.js"></script>
  </body>
</html>
