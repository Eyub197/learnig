<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="https://courses.joshwcomeau.com/favicon.rainbow.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Code Playground</title>
  </head>
  <body>
    <style>
      @keyframes electric {
        from {
          stroke-dashoffset: 0px;
        }
        to {
          stroke-dashoffset: var(--path-length);
        }
      }

      @keyframes wiggle {
        from {
          stroke-dasharray: 5px, 1000px
        }
        to {
          stroke-dasharray: 20px, 1000px;
        }
      }

      .line {
        stroke-dasharray: 10px, 1000px;
        animation:
        electric var(--path-speed) var(--delay) linear infinite backwards,
        wiggle var(--wiggle-duration) ease-in-out infinite alternate;
      }

      /* how can day move at the same speed all of the linest? even though there paths are different lengths
        and every one of them should start whenver it reaches the end soo how?????
        they move in the same speed but diffrent paths soo how they can be the same speed?

      */


    </style>

    <div class="wrapper">
      <svg viewBox="0 0 100 100" fill="none">
        <title>Electrical Wiring</title>
        <!--
          Each of the three lines has two associated paths.
          The “.track” paths are the static background lines,
          while the “line” paths will become our sliding
          red dashes.
        -->
        <path
          class="track one"
          d="
            M 20,10
            L 20,45
            L 50,45
            L 50,100
          "
        />
        <path
          class="line one"
          d="
            M 20,10
            L 20,45
            L 50,45
            L 50,100
          "
        />

        <path
          class="track two"
          d="
            M 80,20
            L 80,60
            L 52,60
            L 52,100
          "
        />
        <path
          class="line two"
          d="
            M 80,20
            L 80,60
            L 52,60
            L 52,100
          "
        />

        <path
          class="track three"
          d="
            M 20,70
            L 48,70
            L 48,100
          "
        />
        <path
          class="line three"
          d="
            M 20,70
            L 48,70
            L 48,100
          "
        />
      </svg>
      <div class="logos">
        <div class="box one">
          <img alt="crown icon" src="https://sandpack-bundler.vercel.app/img/crown.svg" />
        </div>
        <div class="box two">
          <img alt="cat icon" src="https://sandpack-bundler.vercel.app/img/cat.svg" />
        </div>
        <div class="box three">
          <img alt="citrus icon" src="https://sandpack-bundler.vercel.app/img/citrus.svg" />
        </div>
      </div>
    </div>

    <script type="module" src="/src/index.js"></script>
  </body>
</html>
