    </style>

    <svg width="240" height="240">
      <title>Blinknig face</title>
      <circle
        r="120"
        cx="120"
        cy="120"
        fill="hsl(45deg 100% 50%)"
      />

        class="eye"
        cx="80"
        cy="100"
        rx="15"
        ry="20"
        fill="hsl(35deg 80% 20%)"
      />

        class="eye"
        cx="160"
        cy="100"
        rx="15"
        ry="20"

      />

        r="80"
        cx="120"
        cy="90"
        fill="none"
        stroke="hsl(35deg 80% 20%)"
        stroke-width="10"
        stroke-linecap="round"
        stroke-dasharray="90 2000"
        stroke-dashoffset="-80"
      />
    </svg>
