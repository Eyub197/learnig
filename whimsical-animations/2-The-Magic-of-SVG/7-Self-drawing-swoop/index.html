<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="https://courses.joshwcomeau.com/favicon.rainbow.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Code Playground</title>
  </head>
  <body>
    <style>
      .foreground {
        stroke-dasharray: 430, 3000;
        stroke-dashoffset: 430;
      }

      button:hover .foreground {
        stroke-dashoffset: 0px;
      }

      @media (prefers-reduced-motion: no-preference) {
        .foreground {
          transition: stroke-dashoffset 1000ms;
        }
      }
    </style>

    <button type="button">
      <svg viewBox="0 0 326 85" fill="none">
        <title>Swoop</title>
        <defs>
          <path
            id="path-template"
            d="
              M 1,75
              C 1,75 29,-2 67,2
              C 95,4 94,41 122,49
              C 152,56 168,21 199,28
              C 231,35 229,84 263,85
              C 292,85 326,41 326,41
            "
          />
        </defs>

        <use
          href="#path-template"
          class="background"
        />
        <use
          href="#path-template"
          class="foreground"
        />
      </svg>
    </button>

    <script type="module" src="/src/index.js"></script>
  </body>
</html>
