<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="https://courses.joshwcomeau.com/favicon.rainbow.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Playground</title>
  </head>
  <body>
    <style>
      @keyframes go {
        to {
          transform: translate(var(--x), var(--y)) rotate(var(--rotation));
        }
      }

      @keyframes fade {
        to {
          opacity: 0;
        }
      }

      .star {
        position: absolute;
        user-select: none;
        pointer-events: none;
        animation:
          go 1000ms forwards cubic-bezier(0.26, 0.95, 0, 1),
          fade 1000ms 300ms forwards ease;
      }
    </style>

    <!--
      This hidden image is added so that the browser will download
      the image on page load. That way, it’s ready and waiting when
      the user triggers the particle effect.
    -->

    <img
      alt=""
      src="https://sandpack-bundler.vercel.app/img/wand-sparkle.svg"
      style="display: none"
    />

    <script type="module" src="/src/index.js"></script>
  </body>
</html>
