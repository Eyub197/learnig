<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="https://courses.joshwcomeau.com/favicon.rainbow.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Playground</title>
  </head>
  <body>

    <style>
    @keyframes fadeToTransparent {
        to {
          opacity: 0;
        }
      }
      @keyframes disperse {
        to {
          transform:
            translate(
              calc(cos(var(--angle)) * var(--distance)),
              calc(sin(var(--angle)) * var(--distance))
            )
            rotate(var(--rotation));
        }
      }

    .star {
        position: absolute;
        user-select: none;
        pointer-events: none;
        animation:
          disperse var(--pop-duration) forwards cubic-bezier(0.26, 0.95, 0.00, 1.00),
          fadeToTransparent var(--fade-duration) var(--fade-delay) forwards;
      }
    </style>

    <!--
      This hidden image is added so that the browser will download
      the image on page load. That way, it’s ready and waiting when
      the user triggers the particle effect.
    -->

    <img
      alt=""
      src="https://sandpack-bundler.vercel.app/img/wand-sparkle.svg"
      style="display: none"
    />

    <script type="module" src="/src/index.js"></script>
  </body>
</html>
