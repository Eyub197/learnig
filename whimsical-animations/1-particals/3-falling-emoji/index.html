<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="https://courses.joshwcomeau.com/favicon.rainbow.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Playground</title>
  </head>
  <body>
    <style>
      @keyframes fall {
        from {
          transform: translateY(0px);
        }
      }

      .emojiWrapper {
        display: flex;
        justify-content: space-evenly;
        height: 120px;
        font-size: 2rem;
        overflow: clip;
      }

      .emoji {
        transform: translateY(120px);
        animation: fall 2s ease-in-out infinite;
      }
    </style>
    <main>
      <div class="emojiWrapper"></div>
      <img
        class="avatar"
        src="https://sandpack-bundler.vercel.app/img/avatars/002.png"
        alt="user avatar"
      />
      <h1>Someone Bought You A Coffee!</h1>
    </main>

    <script type="module" src="/src/index.js"></script>
  </body>
</html>
