<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="styles.css">
		<title>Button scailing trick</title>
	</head>
	<body>
		<style>
		.btn {
			position: relative;
			border: none;
			background: transparent;
		}
		.btn::before {
			content: "";
			position: absolute;
			width: 100%;
			height: 100%;
			inset: 0;
			border: 1px solid hsl(210deg 15% 25%);
			border-radius: 4px;
			transition: all 200ms;
		}
		.btn:hover::before {
			width: calc(100% + 10px);
			height: calc(100% + 10px);
			inset: -5px;
		}
		</style>

		<button type="button" class="btn">Hello World</button>
	</body>
</html>
