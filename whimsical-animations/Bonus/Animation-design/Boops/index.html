<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="styles.css">
		<title>Document</title>
		<script src="index.js" defer></script>
	</head>
	<body>
		<style>
		:root {
			--boop-spring: linear(
				0,
				0.011,
				0.045 1.4%,
				0.184 3%,
				0.913 8.2%,
				1.156,
				1.304 12.3%,
				1.345,
				1.365,
				1.367,
				1.359 15.8%,
				1.31 17.5%,
				1.027 23.1%,
				0.937 25.3%,
				0.888 27.1%,
				0.873,
				0.866 29%,
				0.867,
				0.88,
				0.905 33.5%,
				0.982 37.5%,
				1.014 39.4%,
				1.038,
				1.049 43.7% 45.2%,
				1.044 46.7%,
				0.995 54.2%,
				0.986,
				0.982 58.4%,
				0.984 61.5%,
				1.002 68.9%,
				1.006 72.9%,
				0.998 87.3%,
				1.001
			);
			--boop-spring-duration: 1.5s;
		}

		.boop-target {
			transition: var(--boop-spring) var(--boop-spring-duration);
		}

		.boop-target.is-booped {
			transform: rotate(20deg);
		}
		</style>

		<button type="button" class="btn">
			<svg class="boop-target" aria-hidden="true" viewBox="0 0 24 24">
				<title>close icon</title>
				<path
					d="
					  M 6,6
						L 18, 18
						M 18, 6
						L 6, 18
				"
				/>
			</svg>
		</button>
	</body>
</html>
